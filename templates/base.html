<!DOCTYPE html>
<html lang="{{s:lang}}" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} — llunatic-lab</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0c'/%3E%3Ctext x='9' y='22' font-family='monospace' font-size='16' fill='%23bef264'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,560&family=Inter:wght@400;500;600;650&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
{{extra_head}}
</head>
<body>
<div class="progress"></div>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="{{s:home_url}}">LLUNATIC<span class="cursor">_</span></a>
    <div class="nav-links">
      <a href="{{s:nav_archive_url}}">{{s:nav_archive}}</a>
      <a href="{{s:nav_about_url}}">{{s:nav_about}}</a>
      <a class="lang-toggle" href="{{s:lang_url}}">{{s:other_label}}</a>
      <button class="icon-btn search-toggle" aria-label="search"></button>
      <button class="icon-btn theme-toggle" aria-label="toggle theme"></button>
    </div>
  </div>
</nav>

<main>
{{content}}
</main>

<footer>
  <div class="wrap">
    <div class="foot-row">
      <span>© <span class="js-year">2026</span> llunaticsys</span>
      <span>{{s:foot_tag}}</span>
      <span><a href="/rss.xml">rss</a> · <a href="/sitemap.xml">sitemap</a></span>
    </div>
  </div>
</footer>

<div class="search-overlay">
  <div class="search-box">
    <input type="text" placeholder="{{s:search_ph}}" aria-label="search">
    <div class="search-hint">{{s:search_hint}}</div>
    <div class="search-results" data-empty="{{s:search_empty}}"></div>
  </div>
</div>

<script src="/assets/js/main.js"></script>
</body>
</html>
